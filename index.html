<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CalorieSnap"><title>CalorieSnap</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f3f3;color:#111}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:28px 22px 175px}.logo{text-align:center;font-size:27px;font-weight:800;margin:4px 0 36px}.label{text-align:center;font-size:12px;letter-spacing:2px;color:#888;font-weight:700}.total{text-align:center;font-size:64px;font-weight:800;line-height:1;margin-top:8px}.unit{text-align:center;color:#777;margin-top:7px}.line{height:1px;background:#eee;margin:30px 0}.title{font-size:20px;font-weight:800;margin-bottom:14px}.empty{background:#f6f6f6;border-radius:18px;padding:24px;text-align:center;color:#777}.empty b{display:block;color:#111;margin-bottom:6px}.meal{display:flex;justify-content:space-between;align-items:center;background:#f7f7f7;border-radius:15px;padding:15px 16px;margin:9px 0}.meal b{display:block}.meal small{color:#888}.meal strong{white-space:nowrap}.take{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);width:min(386px,calc(100% - 44px));height:70px;border:0;border-radius:20px;background:#111;color:#fff;font-size:17px;font-weight:800;box-shadow:0 7px 20px #0003;z-index:4}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:72px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:3}.nav button{border:0;background:none;color:#666;font-size:13px}.nav button.active{color:#111;font-weight:800}.camera{display:none;position:fixed;inset:0;background:#000;z-index:10}.camera video{width:100%;height:100%;object-fit:cover}.camui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:60px 25px 35px}.close{align-self:flex-start;border:0;border-radius:50%;width:44px;height:44px;background:#000b;color:#fff;font-size:20px}.hint{background:#000b;color:#fff;padding:11px 14px;border-radius:12px;font-weight:600}.shutter{width:82px;height:82px;border-radius:50%;border:7px solid #fff;background:#111;box-shadow:0 0 0 3px #fff}.analysis{display:none;position:fixed;inset:0;background:#fff;z-index:20;overflow:auto}.analysis>div{max-width:430px;margin:auto;padding:24px 22px 45px}.photo{width:100%;height:250px;object-fit:cover;border-radius:18px;background:#eee}.back{border:0;background:none;padding:8px 0 20px;font-weight:700;font-size:16px}.status{margin-top:18px;color:#777;font-size:12px;font-weight:800;letter-spacing:1.5px}.analysis h1{font-size:28px;margin:7px 0 20px}.result{background:#f5f5f5;border-radius:18px;padding:18px}.confidence{font-size:13px;color:#666;margin-top:8px}.sum{display:flex;justify-content:space-between;margin-top:16px;padding:17px;background:#111;color:#fff;border-radius:15px;font-weight:800}.add{width:100%;padding:18px;margin-top:14px;border:0;border-radius:16px;background:#111;color:#fff;font-weight:800;font-size:16px}.secondary{width:100%;padding:15px;margin-top:9px;border:1px solid #ddd;border-radius:15px;background:#fff;font-weight:700}.note{font-size:12px;color:#777;line-height:1.5;margin-top:12px}.loading{padding:20px 0;color:#666;text-align:center}.field{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:8px;font-size:16px}.choice{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;background:#fff;text-align:left;margin-top:9px;font-size:15px}.question{font-weight:800;margin-top:18px}.warn{background:#fff6df;border-radius:14px;padding:14px;margin-top:14px;font-size:13px;line-height:1.45}</style></head><body><main class="app"><div class="logo">CalorieSnap</div><div class="label">TODAY</div><div class="total" id="total">0</div><div class="unit">kcal</div><div class="line"></div><div class="title">Today's food</div><div id="meals" class="empty"><b>Nothing logged yet</b>Take a photo of your food to get started.</div></main><button class="take" onclick="startCamera()">📷 &nbsp; TAKE PHOTO</button><nav class="nav"><button class="active">🏠<br>Today</button><button onclick="alert('History is next.')">📖<br>History</button></nav><section id="camera" class="camera"><video id="video" autoplay playsinline></video><div class="camui"><button class="close" onclick="stopCamera()">×</button><div class="hint">Place the whole food or drink in frame</div><button class="shutter" onclick="capture()"></button></div><canvas id="canvas" hidden></canvas></section><section id="analysis" class="analysis"><div><button class="back" onclick="closeAnalysis()">‹ Retake</button><img id="photo" class="photo"><div id="analysisBody"><div class="loading">Analysing the photo…</div></div></div></section><script type="module">import{pipeline,env}from"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4";env.allowLocalModels=false;let classifier=null,stream=null,photoData=null,prediction=null;const KEY="caloriesnap";const pretty=x=>x.replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());function today(){return new Date().toISOString().slice(0,10)}function load(){return JSON.parse(localStorage.getItem(KEY)||"{}")}function render(){const d=load(),m=d[today()]||[],t=m.reduce((a,x)=>a+x.calories,0);document.getElementById("total").textContent=t.toLocaleString();const box=document.getElementById("meals");box.className=m.length?"":"empty";box.innerHTML=m.length?m.map(x=>`<div class="meal"><div><b>${x.name}</b><small>${x.time}</small></div><strong>${x.calories} kcal</strong></div>`).join(""):"<b>Nothing logged yet</b>Take a photo of your food to get started."}async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});document.getElementById("video").srcObject=stream;document.getElementById("camera").style.display="block"}catch(e){alert("Camera access was not allowed. Please use Safari and allow Camera for CalorieSnap.")}}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById("camera").style.display="none"}async function capture(){const v=document.getElementById("video"),c=document.getElementById("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);photoData=c.toDataURL("image/jpeg",.85);document.getElementById("photo").src=photoData;stopCamera();document.getElementById("analysis").style.display="block";await analyseImage()}async function getClassifier(){if(classifier)return classifier;document.getElementById("analysisBody").innerHTML='<div class="loading">Loading the free food-recognition AI…<br><small>First use can take a little longer while the model downloads.</small></div>';try{return classifier=await pipeline("image-classification","onnx-community/swin-finetuned-food101-ONNX",{dtype:"q4f16",device:"webgpu"})}catch(e){return classifier=await pipeline("image-classification","onnx-community/swin-finetuned-food101-ONNX",{dtype:"q4",device:"wasm"})}}async function analyseImage(){try{const model=await getClassifier();const out=await model(photoData,{top_k:5});prediction=out[0];const label=pretty(prediction.label),score=Math.round(prediction.score*100);if(score<35){showUncertain(out);return}if(/coffee|espresso|cappuccino|latte|tea/i.test(prediction.label)){showCoffee(label,score);return}document.getElementById("analysisBody").innerHTML=`<div class="status">AI IDENTIFICATION</div><h1>${label}</h1><div class="result"><b>Confidence: ${score}%</b><div class="confidence">The AI identified the main food category. It has not guessed a weight or calories.</div></div><div class="question">Approximate amount</div><input id="grams" class="field" type="number" inputmode="decimal" placeholder="grams"><div class="warn">A photo cannot reliably measure the exact mass of food. Entering the amount lets us calculate calories without pretending the camera knows the weight.</div><button class="add" onclick="saveFood()">CALCULATE & ADD</button><button class="secondary" onclick="closeAnalysis()">Retake photo</button>`}catch(e){document.getElementById("analysisBody").innerHTML='<div class="status">ANALYSIS FAILED</div><h1>We could not analyse this photo</h1><div class="result">No calorie number has been invented. Please retake the photo in better light.</div><button class="add" onclick="closeAnalysis()">Retake photo</button>'}}function showCoffee(label,score){document.getElementById("analysisBody").innerHTML=`<div class="status">AI IDENTIFICATION</div><h1>☕ ${label}</h1><div class="result"><b>Confidence: ${score}%</b><div class="confidence">The AI recognises this as a coffee/drink. It will not call it chicken or another meal.</div></div><div class="question">How much was in the cup?</div><input id="ml" class="field" type="number" inputmode="decimal" placeholder="Approx. ml, e.g. 250"><div class="question">What was added?</div><button class="choice" onclick="setCoffee('black')">Black coffee — no milk/sugar</button><button class="choice" onclick="setCoffee('milk')">Coffee + milk</button><button class="choice" onclick="setCoffee('sugar')">Coffee + milk + sugar</button><button class="choice" onclick="setCoffee('custom')">I'll enter the ingredients</button><div id="coffeeExtra"></div><button class="add" onclick="saveCoffee()">CALCULATE & ADD</button><button class="secondary" onclick="closeAnalysis()">Retake photo</button>`}function setCoffee(type){document.getElementById("coffeeExtra").innerHTML=type==='black'?'<div class="note">Black brewed coffee is very low calorie; the exact value depends on the drink.</div>':type==='milk'?'<input id="milkml" class="field" type="number" inputmode="decimal" placeholder="Milk amount in ml"><div class="note">Choose the milk type in the next build; we will connect this to a nutrition database.</div>':type==='sugar'?'<input id="milkml" class="field" type="number" inputmode="decimal" placeholder="Milk amount in ml"><input id="sugar" class="field" type="number" inputmode="decimal" placeholder="Teaspoons of sugar">': '<input id="custom" class="field" placeholder="e.g. semi-skimmed milk + 2 sugars">'}function showUncertain(out){document.getElementById("analysisBody").innerHTML='<div class="status">NOT CONFIDENT ENOUGH</div><h1>What did you photograph?</h1><div class="result">The AI is not confident enough to assign a food. We will not invent a calorie value.</div>'+out.slice(0,3).map(x=>`<button class="choice" onclick="manual('${x.label.replaceAll("'","\\'")}')">${pretty(x.label)} — ${Math.round(x.score*100)}%</button>`).join('')+'<button class="secondary" onclick="closeAnalysis()">Retake photo</button>'}window.manual=x=>{prediction={label:x,score:1};analyseImage()};window.saveFood=()=>{const g=Number(document.getElementById("grams")?.value||0);if(!g){alert("Enter the approximate amount first.");return}alert("Nutrition calculation is the next step. The app will not guess calories from grams alone.")};window.saveCoffee=()=>{const ml=Number(document.getElementById("ml")?.value||0);if(!ml){alert("Enter the approximate drink volume first.");return}alert("Coffee identified correctly. The nutrition calculator is being connected next so milk and sugar are calculated from real nutrition values.")};window.closeAnalysis=()=>document.getElementById("analysis").style.display="none";window.startCamera=startCamera;window.stopCamera=stopCamera;window.capture=capture;render();</script></body></html>
