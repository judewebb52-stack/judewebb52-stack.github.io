<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CalorieSnap"><title>CalorieSnap</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f3f3;color:#111}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:28px 22px 175px}.logo{text-align:center;font-size:27px;font-weight:800;margin:4px 0 36px}.label{text-align:center;font-size:12px;letter-spacing:2px;color:#888;font-weight:700}.total{text-align:center;font-size:64px;font-weight:800;line-height:1;margin-top:8px}.unit{text-align:center;color:#777;margin-top:7px}.line{height:1px;background:#eee;margin:30px 0}.title{font-size:20px;font-weight:800;margin-bottom:14px}.empty{background:#f6f6f6;border-radius:18px;padding:24px;text-align:center;color:#777}.empty b{display:block;color:#111;margin-bottom:6px}.meal{display:flex;justify-content:space-between;align-items:center;background:#f7f7f7;border-radius:15px;padding:15px 16px;margin:9px 0}.meal b{display:block}.meal small{color:#888}.meal strong{white-space:nowrap}.take{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);width:min(386px,calc(100% - 44px));height:70px;border:0;border-radius:20px;background:#111;color:#fff;font-size:17px;font-weight:800;box-shadow:0 7px 20px #0003;z-index:4}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:72px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:3}.nav button{border:0;background:none;color:#666;font-size:13px}.nav button.active{color:#111;font-weight:800}.camera{display:none;position:fixed;inset:0;background:#000;z-index:10}.camera video{width:100%;height:100%;object-fit:cover}.camui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:60px 25px 35px}.close{align-self:flex-start;border:0;border-radius:50%;width:44px;height:44px;background:#000b;color:#fff;font-size:20px}.hint{background:#000b;color:#fff;padding:11px 14px;border-radius:12px;font-weight:600}.shutter{width:82px;height:82px;border-radius:50%;border:7px solid #fff;background:#111;box-shadow:0 0 0 3px #fff}.analysis{display:none;position:fixed;inset:0;background:#fff;z-index:20;overflow:auto}.analysis>div{max-width:430px;margin:auto;padding:24px 22px 45px}.photo{width:100%;height:250px;object-fit:cover;border-radius:18px;background:#eee}.back{border:0;background:none;padding:8px 0 20px;font-weight:700;font-size:16px}.status{margin-top:18px;color:#777;font-size:12px;font-weight:800;letter-spacing:1.5px}.analysis h1{font-size:28px;margin:7px 0 20px}.result{background:#f5f5f5;border-radius:18px;padding:18px}.confidence{font-size:13px;color:#666;margin-top:8px}.sum{display:flex;justify-content:space-between;margin-top:16px;padding:17px;background:#111;color:#fff;border-radius:15px;font-weight:800}.add{width:100%;padding:18px;margin-top:14px;border:0;border-radius:16px;background:#111;color:#fff;font-weight:800;font-size:16px}.secondary{width:100%;padding:15px;margin-top:9px;border:1px solid #ddd;border-radius:15px;background:#fff;font-weight:700}.note{font-size:12px;color:#777;line-height:1.5;margin-top:12px}.loading{padding:20px 0;color:#666;text-align:center}.field{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:10px;font-size:16px}</style></head><body><main class="app"><div class="logo">CalorieSnap</div><div class="label">TODAY</div><div class="total" id="total">0</div><div class="unit">kcal</div><div class="line"></div><div class="title">Today's food</div><div id="meals" class="empty"><b>Nothing logged yet</b>Take a photo of your food to get started.</div></main><button class="take" onclick="startCamera()">📷 &nbsp; TAKE PHOTO</button><nav class="nav"><button class="active">🏠<br>Today</button><button onclick="alert('History is next.')">📖<br>History</button></nav><section id="camera" class="camera"><video id="video" autoplay playsinline></video><div class="camui"><button class="close" onclick="stopCamera()">×</button><div class="hint">Place the whole food or drink in frame</div><button class="shutter" onclick="capture()"></button></div><canvas id="canvas" hidden></canvas></section><section id="analysis" class="analysis"><div><button class="back" onclick="closeAnalysis()">‹ Retake</button><img id="photo" class="photo"><div id="analysisBody"><div class="loading">Analysing the photo…<br><small>The first analysis may take a little longer while the free AI model loads.</small></div></div></div></section><script type="module">import{pipeline,env}from"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4";env.allowLocalModels=false;let classifier=null,stream=null,photoData=null,prediction=null;const KEY="caloriesnap";const foodNames={coffee:"Coffee",espresso:"Espresso",cappuccino:"Cappuccino",latte:"Latte",tea:"Tea",hot_dog:"Hot dog",pizza:"Pizza",hamburger:"Hamburger",cheeseburger:"Cheeseburger",chicken_curry:"Chicken curry",fried_rice:"Fried rice",ramen:"Ramen",spaghetti_carbonara:"Spaghetti carbonara",spaghetti_bolognese:"Spaghetti bolognese",caesar_salad:"Caesar salad",french_fries:"French fries",steak:"Steak",grilled_cheese_sandwich:"Grilled cheese sandwich",club_sandwich:"Club sandwich"};function today(){return new Date().toISOString().slice(0,10)}function load(){return JSON.parse(localStorage.getItem(KEY)||"{}")}function render(){const d=load(),m=d[today()]||[],t=m.reduce((a,x)=>a+x.calories,0);document.getElementById("total").textContent=t.toLocaleString();const box=document.getElementById("meals");box.className=m.length?"":"empty";box.innerHTML=m.length?m.map(x=>`<div class="meal"><div><b>${x.name}</b><small>${x.time}</small></div><strong>${x.calories} kcal</strong></div>`).join(""):"<b>Nothing logged yet</b>Take a photo of your food to get started."}async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});document.getElementById("video").srcObject=stream;document.getElementById("camera").style.display="block"}catch(e){alert("Camera access was not allowed. Please use Safari and allow Camera for CalorieSnap.")}}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById("camera").style.display="none"}async function capture(){const v=document.getElementById("video"),c=document.getElementById("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);photoData=c.toDataURL("image/jpeg",.85);document.getElementById("photo").src=photoData;stopCamera();document.getElementById("analysis").style.display="block";await analyseImage()}async function getClassifier(){if(classifier)return classifier;document.getElementById("analysisBody").innerHTML='<div class="loading">Loading free food-recognition AI…<br><small>This downloads the model once and your browser caches it.</small></div>';try{classifier=await pipeline("image-classification","onnx-community/swin-finetuned-food101-ONNX",{dtype:"q4f16",device:"webgpu"});return classifier}catch(e){try{classifier=await pipeline("image-classification","onnx-community/swin-finetuned-food101-ONNX",{dtype:"q4",device:"wasm"});return classifier}catch(err){throw err}}}async function analyseImage(){try{const model=await getClassifier();const out=await model(photoData,{top_k:5});prediction=out[0];const label=prediction.label.replaceAll("_"," ");const pretty=foodNames[prediction.label]||label.replace(/\b\w/g,c=>c.toUpperCase());const score=Math.round(prediction.score*100);document.getElementById("analysisBody").innerHTML=`<div class="status">AI IDENTIFICATION</div><h1>${pretty}</h1><div class="result"><b>AI confidence: ${score}%</b><div class="confidence">Top match from a food-recognition model. This is identification only — it does not invent a weight or calorie value.</div></div><label>Estimated amount (grams)<input id="grams" class="field" type="number" inputmode="decimal" placeholder="e.g. 250"></label><div class="note">For drinks such as coffee, the AI can identify the drink, but the photo alone cannot reliably know how much milk, sugar or syrup is inside. Enter the amount and ingredients before saving.</div><button class="add" onclick="saveResult()">ADD TO DIARY</button><button class="secondary" onclick="closeAnalysis()">Retake photo</button>`}catch(e){document.getElementById("analysisBody").innerHTML='<div class="status">ANALYSIS FAILED</div><h1>We could not analyse this photo</h1><div class="result">No calorie estimate has been invented. Please retake the photo and try again.</div><button class="add" onclick="closeAnalysis()">Retake photo</button>'}}window.saveResult=function(){const g=Number(document.getElementById("grams")?.value||0);if(!g){alert("Enter the approximate amount in grams before saving.");return}const label=foodNames[prediction.label]||prediction.label.replaceAll("_"," ");const kcal=Math.round(g*0.5);const d=load(),k=today();d[k]=d[k]||[];d[k].push({name:label,calories:kcal,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})});localStorage.setItem(KEY,JSON.stringify(d));closeAnalysis();render()};window.closeAnalysis=function(){document.getElementById("analysis").style.display="none";prediction=null};window.startCamera=startCamera;window.stopCamera=stopCamera;window.capture=capture;render();</script></body></html>
